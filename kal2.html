<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator BMI</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: Arial, sans-serif;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 350px;
      }
      h2 {
        text-align: center;
        color: #333;
        margin-top: 0;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: bold;
      }
      input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: #667eea;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background-color: #764ba2;
      }
      #hasil {
        margin-top: 25px;
        padding: 20px;
        background-color: #f5f5f5;
        border-radius: 8px;
        border-left: 5px solid #667eea;
      }
      .bmi-value {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }
      .bmi-status {
        font-size: 16px;
        color: #666;
      }
      .error {
        color: #e74c3c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Kalkulator BMI</h2>

      <div class="form-group">
        <label for="TingBad">Tinggi Badan (cm)</label>
        <input type="number" id="TingBad" placeholder="Contoh: 170" min="0" />
      </div>

      <div class="form-group">
        <label for="BerBad">Berat Badan (kg)</label>
        <input type="number" id="BerBad" placeholder="Contoh: 70" min="0" />
      </div>

      <button type="button" id="submit">Hitung BMI</button>

      <div id="hasil" style="display: none"></div>
    </div>

    <script>
      let tinggi = document.getElementById("TingBad");
      let berat = document.getElementById("BerBad");
      let submit = document.getElementById("submit");
      let hasilDiv = document.getElementById("hasil");

      submit.addEventListener("click", function () {
        let tinggiVal = parseFloat(tinggi.value);
        let beratVal = parseFloat(berat.value);

        if (
          tinggiVal <= 0 ||
          beratVal <= 0 ||
          isNaN(tinggiVal) ||
          isNaN(beratVal)
        ) {
          hasilDiv.innerHTML =
            '<span class="error">Masukkan tinggi dan berat badan yang valid!</span>';
          hasilDiv.style.display = "block";
          return;
        }

        // Konversi tinggi dari cm ke meter
        let tinggiMeter = tinggiVal / 100;

        // Rumus BMI: berat / (tinggi^2)
        let bmi = beratVal / (tinggiMeter * tinggiMeter);
        bmi = bmi.toFixed(2);

        let status = "";
        let statusClass = "";

        if (bmi < 18.5) {
          status = "Berat Badan Kurang Ideal";
          statusClass = "error";
        } else if (bmi >= 18.5 && bmi < 25) {
          status = "Berat Badan Ideal";
          statusClass = "";
        } else if (bmi >= 25 && bmi < 30) {
          status = "Berat Badan Berlebih";
          statusClass = "error";
        } else if (bmi >= 30) {
          status = "Obesitas";
          statusClass = "error";
        }

        hasilDiv.innerHTML =
          '<div class="bmi-value">BMI: ' +
          bmi +
          '</div><div class="bmi-status ' +
          statusClass +
          '">' +
          status +
          "</div>";
        hasilDiv.style.display = "block";
      });

      // Kirim kalkulasi saat Enter ditekan
      berat.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          submit.click();
        }
      });
    </script>
  </body>
</html>
